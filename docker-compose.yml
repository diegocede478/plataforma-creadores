services:
  postgres:
    image: postgres:16-alpine
    container_name: creata-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: creata
      POSTGRES_PASSWORD: creata123
      POSTGRES_DB: creata_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creata -d creata_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
